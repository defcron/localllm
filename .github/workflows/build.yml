name: Android build and tests

on:
  push:
    branches:
      - fix-mobile-vulkan-stability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out bundle
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # `tools` is a retired SDK package; requesting it makes sdkmanager exit 1.
          packages: platform-tools

      - name: Install Android build packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Extract project ZIP
        run: unzip -q LocalLlm.zip -d "$RUNNER_TEMP/localllm"

      - name: Check shell and Python syntax
        working-directory: ${{ runner.temp }}/localllm/LocalLlm
        run: |
          bash -n setup.sh gradlew ci/provision-glslc.sh
          python3 -m py_compile tools/*.py tools/tests/test_host.py

      - name: Run native host regression tests
        working-directory: ${{ runner.temp }}/localllm/LocalLlm
        run: python3 -m unittest discover -s tools/tests -v

      - name: Prepare pinned native dependencies
        working-directory: ${{ runner.temp }}/localllm/LocalLlm
        run: ./setup.sh

      - name: Install host GLSL compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc

      - name: Validate host GLSL compiler
        working-directory: ${{ runner.temp }}/localllm/LocalLlm
        run: |
          GLSLC_PATH="$(command -v glslc)"
          GLSLC="$GLSLC_PATH" ./ci/provision-glslc.sh
          echo "GLSLC=$GLSLC_PATH" >> "$GITHUB_ENV"
          echo "Vulkan_GLSLC_EXECUTABLE=$GLSLC_PATH" >> "$GITHUB_ENV"

      - name: Run Kotlin tests and assemble Android APK
        working-directory: ${{ runner.temp }}/localllm/LocalLlm
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalLlm-debug-apk
          path: ${{ runner.temp }}/localllm/LocalLlm/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
