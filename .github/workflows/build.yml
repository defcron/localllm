name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar xz-utils unzip git

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "cmake;3.31.6"

      # Must run BEFORE Gradle. It writes GLSLC, Vulkan_GLSLC_EXECUTABLE and
      # PATH into GITHUB_ENV / GITHUB_PATH so every later step can see them.
      - name: Provision host glslc
        run: bash LocalLlm/ci/provision-glslc.sh

      - name: Verify host glslc is visible to later steps
        run: |
          set -euo pipefail
          test -n "${GLSLC:-}" || { echo "GLSLC was not exported by provisioning" >&2; exit 1; }
          test -x "$GLSLC"
          "$GLSLC" --version

      - name: Fetch native dependencies
        working-directory: LocalLlm
        run: ./setup.sh

      - name: Host tests
        working-directory: LocalLlm
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Build debug APK
        working-directory: LocalLlm
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: localllm-debug-apk
          path: LocalLlm/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
